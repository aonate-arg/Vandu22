<!doctype html>
<html lang="es" data-theme="noche">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vandú · CalendarRow</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>body{margin:0;background:var(--bg)}</style>
</head>
<body>
<div class="vd" style="background: var(--bg); padding: 24px">
  <div class="vd-cal" style="max-width: 560px">
    <div class="vd-cal__row"><span class="vd-cal__date">[DD/MM]</span><span class="vd-cal__name">[GP próximo]</span><a class="vd-btn vd-btn--primary vd-btn--sm" href="#">Reservar</a></div>
    <div class="vd-cal__row"><span class="vd-cal__date">[DD/MM]</span><span class="vd-cal__name">[GP siguiente]</span><span class="vd-tag vd-tag--low">Pronto</span></div>
    <div class="vd-cal__row is-break"><span class="vd-cal__date">DIC–FEB</span><span class="vd-cal__name">Receso · Misión comunidad</span><a class="vd-btn vd-btn--secondary vd-btn--sm" href="#">Sumarme</a></div>
    <div class="vd-cal__row"><span class="vd-cal__date">2027</span><span class="vd-cal__name">Largada temporada</span><a class="vd-btn vd-btn--ghost" href="#">Avisame</a></div>
  </div>
</div>

</body>
</html>
