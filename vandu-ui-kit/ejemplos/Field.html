<!doctype html>
<html lang="es" data-theme="noche">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vandú · Field</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>body{margin:0;background:var(--bg)}</style>
</head>
<body>
<div class="vd" style="background: var(--bg); padding: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px">
  <div style="display: flex; flex-direction: column; gap: 16px">
    <div class="vd-field">
      <label class="vd-field__label" for="f-mail">Tu mail <small>(obligatorio)</small></label>
      <input class="vd-input" id="f-mail" type="email" placeholder="vos@mail.com">
    </div>
    <div class="vd-field is-error">
      <label class="vd-field__label" for="f-mail-err">Tu mail</label>
      <input class="vd-input" id="f-mail-err" type="email" value="vos@mail" aria-describedby="f-err">
      <p class="vd-field__error" id="f-err"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 4v3.5M7 9.8v.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Revisá el mail</p>
    </div>
  </div>
  <div class="vd-field">
    <label class="vd-field__label" for="f-msg">Tu mensaje</label>
    <textarea class="vd-textarea" id="f-msg" placeholder="Ej: prode en vivo, comida temática por GP…"></textarea>
  </div>
</div>

</body>
</html>
