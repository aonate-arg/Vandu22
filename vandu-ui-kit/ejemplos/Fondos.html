<!doctype html>
<html lang="es" data-theme="noche">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vandú · Fondos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;1,800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  body { margin: 0; background: var(--bg); }
  .demo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; padding: 24px; }
  .demo__tile { min-height: 320px; display: flex; align-items: flex-end; padding: 24px; box-sizing: border-box; }
  @media (max-width: 767px) { .demo { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="vd demo">
  <!-- 1 · Velocidad (navy) -->
  <section class="demo__tile vd-bg vd-bg-velocidad">
    <span class="vd-tag vd-tag--open">vd-bg-velocidad</span>
  </section>
  <!-- 1 · Velocidad blanco -->
  <section class="demo__tile vd-bg vd-bg-velocidad-blanco">
    <span class="vd-tag vd-tag--out">vd-bg-velocidad-blanco</span>
  </section>
  <!-- 3 · Monograma (navy) -->
  <section class="demo__tile vd-bg vd-bg-monograma">
    <span class="vd-tag vd-tag--open">vd-bg-monograma</span>
  </section>
  <!-- 3 · Monograma blanco -->
  <section class="demo__tile vd-bg vd-bg-monograma-blanco">
    <span class="vd-tag vd-tag--out">vd-bg-monograma-blanco</span>
  </section>
</div>
</body>
</html>
