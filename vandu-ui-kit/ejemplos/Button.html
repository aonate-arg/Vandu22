<!doctype html>
<html lang="es" data-theme="noche">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vandú · Button</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>body{margin:0;background:var(--bg)}</style>
</head>
<body>
<div class="vd" style="background: var(--bg); padding: 24px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
    <button type="button" class="vd-btn vd-btn--primary">Quiero mi entrada</button>
    <button type="button" class="vd-btn vd-btn--secondary">¿Qué es Vandú?</button>
    <button type="button" class="vd-btn vd-btn--ghost">Ver remera</button>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
    <button type="button" class="vd-btn vd-btn--primary vd-btn--sm">Reservar</button>
    <button type="button" class="vd-btn vd-btn--secondary vd-btn--sm">Volver</button>
    <button type="button" class="vd-btn vd-btn--primary" disabled>Agotado</button>
  </div>
</div>

</body>
</html>
