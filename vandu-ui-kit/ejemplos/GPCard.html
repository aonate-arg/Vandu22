<!doctype html>
<html lang="es" data-theme="noche">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vandú · GPCard</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>body{margin:0;background:var(--bg)}</style>
</head>
<body>
<div class="vd" style="background: var(--bg); padding: 24px">
  <article class="vd-card vd-gp" style="max-width: 380px">
    <div class="vd-gp__top">
      <div class="vd-gp__flag" aria-label="Bandera del país"></div>
      <span class="vd-tag vd-tag--open">Abierto</span>
    </div>
    <h3 class="vd-gp__name" style="margin: 0">[Nombre del GP]</h3>
    <div class="vd-gp__meta">
      <div><span class="vd-label">Fecha</span><p class="vd-gp__value">[DD/MM · 00:00]</p></div>
      <div><span class="vd-label">Cupo</span><p class="vd-gp__value">[N] lugares</p></div>
    </div>
    <div><span class="vd-label">Sede</span><p class="vd-gp__value">[Bar · dirección]</p></div>
    <a class="vd-btn vd-btn--primary vd-btn--block" href="#">Quiero mi entrada</a>
  </article>
</div>

</body>
</html>
