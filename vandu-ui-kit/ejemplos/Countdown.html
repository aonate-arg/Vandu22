<!doctype html>
<html lang="es" data-theme="noche">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vandú · Countdown</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>body{margin:0;background:var(--bg)}</style>
</head>
<body>
<div class="vd" style="background: var(--bg); padding: 24px; display: flex; flex-direction: column; gap: 12px">
  <span class="vd-label">Largada 2027</span>
  <div class="vd-countdown" role="timer" aria-label="Faltan 12 días, 08 horas, 45 minutos">
    <div class="vd-countdown__cell"><span class="vd-countdown__num">12</span><span class="vd-countdown__unit">días</span></div>
    <div class="vd-countdown__cell"><span class="vd-countdown__num">08</span><span class="vd-countdown__unit">hs</span></div>
    <div class="vd-countdown__cell"><span class="vd-countdown__num">45</span><span class="vd-countdown__unit">min</span></div>
    <div class="vd-countdown__cell"><span class="vd-countdown__num">30</span><span class="vd-countdown__unit">seg</span></div>
  </div>
</div>

</body>
</html>
